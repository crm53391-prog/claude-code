<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OMH Chaussures</title>
<meta name="description" content="OMH, boutique de chaussures : baskets, babouches, talons, bottes, sandales, enfants. Commande sur WhatsApp, paiement à la livraison.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Readex+Pro:wght@300..600&family=Reem+Kufi:wght@500..700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!--OMH-BODY-START-->
<a class="skip" href="#shelves" data-i18n="skip">Aller au catalogue</a>

<header class="top">
  <div class="top__inner wrap">
    <a class="logo" href="#top" aria-label="OMH">OMH</a>
    <nav class="top__nav" aria-label="Menu">
      <a href="#aisles" data-i18n="navCatalogue">Catalogue</a>
      <a href="#pointures" data-i18n="navSizes">Guide des pointures</a>
      <a href="#boutique" data-i18n="navShop">Boutique</a>
    </nav>
    <div class="top__tools">
      <div class="lang" role="group" aria-label="Langue / اللغة / Language">
        <button type="button" class="lang__btn" data-lang="fr" lang="fr">FR</button>
        <button type="button" class="lang__btn" data-lang="ar" lang="ar">ع</button>
        <button type="button" class="lang__btn" data-lang="en" lang="en">EN</button>
      </div>
      <button type="button" class="cart-btn" id="open-cart" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 8V6a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        <span class="cart-btn__label" data-i18n="cart">Panier</span>
        <span class="cart-btn__count" id="cart-count">0</span>
      </button>
    </div>
  </div>
</header>

<main id="top">
  <section class="hero wrap" aria-labelledby="hero-title">
    <h1 id="hero-title" class="hero__title" aria-live="polite"></h1>
    <div class="plate">
      <div class="plate__scroll" id="ruler-scroll">
        <div class="plate__track" id="ruler" role="group" aria-labelledby="hero-title">
          <span class="plate__slider" id="slider" aria-hidden="true"></span>
        </div>
      </div>
    </div>
    <div class="hero__foot">
      <p class="hero__text" data-i18n="heroText"></p>
      <p class="hero__hint" data-i18n="rulerHint"></p>
    </div>
  </section>

  <nav class="aisles wrap" id="aisles" aria-labelledby="aisles-title" tabindex="-1">
    <h2 id="aisles-title" class="visually-hidden" data-i18n="aisles">Rayons</h2>
    <div class="aisles__grid" id="aisle-list"></div>
  </nav>

  <div class="filters" id="filters">
    <div class="filters__inner wrap">
      <div class="filters__left">
        <span class="chip" id="size-chip" hidden></span>
        <div class="seg" id="gender" role="group"></div>
      </div>
      <div class="filters__right">
        <p class="filters__count" id="result-count" aria-live="polite"></p>
        <label class="sort" for="sort">
          <span data-i18n="sort">Trier</span>
          <select id="sort">
            <option value="popular" data-i18n="sortPopular">Sélection OMH</option>
            <option value="up" data-i18n="sortPriceUp">Prix croissant</option>
            <option value="down" data-i18n="sortPriceDown">Prix décroissant</option>
          </select>
        </label>
      </div>
    </div>
  </div>

  <div class="shelves wrap" id="shelves" tabindex="-1"></div>
  <div class="empty wrap" id="empty" hidden>
    <p class="empty__title" data-i18n="emptyTitle"></p>
    <p data-i18n="emptyText"></p>
    <button type="button" class="btn btn--line" id="reset" data-i18n="emptyReset">Effacer les filtres</button>
  </div>

  <div class="info wrap">
    <section id="pointures" class="guide" aria-labelledby="guide-title">
      <h2 id="guide-title" data-i18n="sizeGuideTitle">Trouver sa pointure</h2>
      <p data-i18n="sizeGuideText"></p>
      <div class="guide__table">
        <table>
          <thead><tr><th scope="col" data-i18n="euSize">Pointure EU</th><th scope="col" data-i18n="footLength">Longueur du pied</th></tr></thead>
          <tbody id="guide-rows"></tbody>
        </table>
      </div>
    </section>

    <section id="boutique" class="shop" aria-labelledby="shop-title">
      <h2 id="shop-title" data-i18n="contactTitle">La boutique</h2>
      <p data-i18n="contactText"></p>
      <p class="shop__phone" id="phone"></p>
      <p class="shop__line">
        <button type="button" class="btn btn--line" id="copy-phone" data-i18n="copy">Copier le numéro</button>
        <span class="shop__city" id="city"></span>
      </p>
    </section>
  </div>
</main>

<footer class="foot wrap">
  <span class="logo logo--small">OMH</span>
  <span data-i18n="footer"></span>
</footer>

<dialog class="sheet" id="product" aria-labelledby="p-name">
  <form method="dialog" class="sheet__close"><button class="icon-btn" aria-label="Fermer" data-i18n-label="close">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button></form>
  <div class="sheet__body" id="product-body"></div>
</dialog>

<dialog class="drawer" id="cart" aria-labelledby="cart-title">
  <div class="drawer__head">
    <h2 id="cart-title" data-i18n="cartTitle">Votre panier</h2>
    <form method="dialog"><button class="icon-btn" aria-label="Fermer" data-i18n-label="close">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button></form>
  </div>
  <div class="drawer__body" id="cart-body"></div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<!--OMH-BODY-END-->

<script src="products.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
