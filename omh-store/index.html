<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OMH Chaussures</title>
<meta name="description" content="OMH, boutique de chaussures au Maroc. Commande sur WhatsApp, paiement à la livraison.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="css/store.css">
</head>
<body>
<!--OMH-BODY-START-->
<a class="skip" href="#products" data-i18n="skip">Aller aux produits</a>

<p class="announce" id="announce" hidden></p>

<header class="top" id="top">
  <div class="top__inner">
    <a class="logo" href="#" aria-label="OMH">OMH</a>
    <label class="search" for="q">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="visually-hidden" data-i18n="search">Rechercher</span>
      <input id="q" type="search" autocomplete="off" data-i18n-ph="search">
    </label>
    <div class="top__tools">
      <div class="lang" role="group" aria-label="Langue / اللغة / Language">
        <button type="button" data-lang="fr" lang="fr">FR</button>
        <button type="button" data-lang="ar" lang="ar">ع</button>
        <button type="button" data-lang="en" lang="en">EN</button>
      </div>
      <button type="button" class="icon-btn" id="open-favs" data-i18n-label="favourites">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span class="count" id="fav-count" hidden></span>
      </button>
      <button type="button" class="cart-btn" id="open-cart" aria-haspopup="dialog">
        <span data-i18n="cart">Panier</span><span class="cart-btn__n" id="cart-count">0</span>
      </button>
    </div>
  </div>
</header>

<main>
  <section class="hero" id="hero" aria-labelledby="hero-title">
    <div class="hero__frame" id="hero-frame">
      <div class="hero__media" id="hero-media"></div>
      <div class="hero__copy">
        <h1 class="hero__title" id="hero-title">OMH</h1>
        <p class="hero__text" id="hero-text"></p>
      </div>
    </div>
  </section>

  <section class="rayons" id="rayons" aria-labelledby="rayons-title" hidden>
    <h2 class="section-title" id="rayons-title" data-i18n="sections">Rayons</h2>
    <ul class="rayons__list" id="rayons-list"></ul>
  </section>

  <section class="shop" id="products" aria-labelledby="shop-title" tabindex="-1">
    <div class="toolbar" id="toolbar">
      <h2 class="visually-hidden" id="shop-title" data-i18n="all">Tout</h2>
      <div class="views" id="views" role="group"></div>
      <div class="toolbar__right">
        <p class="toolbar__count" id="count" aria-live="polite"></p>
        <label class="sort" for="sort">
          <span data-i18n="sort">Trier</span>
          <select id="sort">
            <option value="new" data-i18n="sortNew"></option>
            <option value="up" data-i18n="sortUp"></option>
            <option value="down" data-i18n="sortDown"></option>
            <option value="rated" data-i18n="sortRated"></option>
          </select>
        </label>
      </div>
    </div>
    <ul class="grid" id="grid"></ul>
    <div class="empty" id="empty" hidden></div>
  </section>

  <section class="voices" id="voices" aria-labelledby="voices-title" hidden>
    <h2 class="section-title" id="voices-title" data-i18n="reviewsTitle">Ce que disent nos clients</h2>
    <ul class="voices__list" id="voices-list"></ul>
  </section>

  <ul class="perks" id="perks"></ul>
</main>

<footer class="foot">
  <div class="foot__brand">
    <span class="foot__logo">OMH</span>
    <p data-i18n="footerLine"></p>
  </div>
  <div class="foot__contact">
    <h2 data-i18n="contact">Contact</h2>
    <p id="foot-phone" class="foot__phone"></p>
    <p id="foot-city"></p>
    <p id="foot-insta"></p>
  </div>
  <p class="foot__admin"><a href="admin.html" data-i18n="admin">Espace admin</a></p>
  <p class="foot__demo" id="demo-note" hidden data-i18n="demo"></p>
</footer>

<dialog class="sheet" id="product" aria-labelledby="p-name">
  <form method="dialog" class="sheet__close"><button class="icon-btn icon-btn--solid" data-i18n-label="close">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button></form>
  <div class="sheet__body" id="product-body"></div>
</dialog>

<dialog class="drawer" id="cart" aria-labelledby="cart-title">
  <div class="drawer__head">
    <h2 id="cart-title" data-i18n="cartTitle">Votre panier</h2>
    <form method="dialog"><button class="icon-btn" data-i18n-label="close">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button></form>
  </div>
  <div class="drawer__body" id="cart-body"></div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<!--OMH-BODY-END-->

<script src="vendor/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/store.js"></script>
</body>
</html>
