<meta name="claude:viewport-fit-sides" content="cover">
<title>كراسة الطب S3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Noto+Naskh+Arabic:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a bound codex — fixed rubric binding rule at the spine edge, one
   measured text column, and a margin column that carries the opinion card on
   wide screens and folds under the notes on narrow ones. */
:root{
  --paper:#EDEEE8; --leaf:#F7F8F3; --leaf-2:#E6E8E0;
  --ink:#1B2027; --ink-soft:#56606E; --ink-faint:#8B94A0;
  --rule:#D3D6CC; --rule-soft:#E0E2D9;
  --rubric:#8C2B2B; --indigo:#2C4470;
  --todo:#9099A4; --doing:#8E6517; --done:#3F6B4E;
  --c1:#2F4573; --c2:#7A3236; --c3:#43603C; --c4:#7A5A22; --c5:#2F5F63; --c6:#5A3A60;
  --serif:'Spectral','Noto Naskh Arabic','Iowan Old Style',Georgia,serif;
  --naskh:'Noto Naskh Arabic','Spectral','Geeza Pro','Times New Roman',serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --measure:66ch;
  --shadow:0 1px 2px rgba(27,32,39,.05),0 8px 24px -14px rgba(27,32,39,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#13171C; --leaf:#1A1F26; --leaf-2:#222831;
  --ink:#E6E4DB; --ink-soft:#A6AEB9; --ink-faint:#737D8A;
  --rule:#2E353F; --rule-soft:#232A32;
  --rubric:#CB6F6B; --indigo:#8AA6DC;
  --todo:#6C7684; --doing:#C79A48; --done:#7CA98A;
  --c1:#8AA6DC; --c2:#D8898C; --c3:#9CBE92; --c4:#D7B46A; --c5:#86BDC0; --c6:#BE96C4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#13171C; --leaf:#1A1F26; --leaf-2:#222831;
  --ink:#E6E4DB; --ink-soft:#A6AEB9; --ink-faint:#737D8A;
  --rule:#2E353F; --rule-soft:#232A32;
  --rubric:#CB6F6B; --indigo:#8AA6DC;
  --todo:#6C7684; --doing:#C79A48; --done:#7CA98A;
  --c1:#8AA6DC; --c2:#D8898C; --c3:#9CBE92; --c4:#D7B46A; --c5:#86BDC0; --c6:#BE96C4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}

/* The UI reads in Arabic, French or English; Arabic sets the naskh face and
   RTL, the two Latin languages take the serif and the small-caps label
   register the design was drawn with. Course names stay French throughout. */
:root[lang="fr"],:root[lang="en"]{--naskh:'Spectral','Noto Naskh Arabic','Iowan Old Style',Georgia,serif}
:root[lang="fr"] .field label,:root[lang="en"] .field label,
:root[lang="fr"] .ctl > span,:root[lang="en"] .ctl > span,
:root[lang="fr"] .card .lab,:root[lang="en"] .card .lab,
:root[lang="fr"] .pager .k,:root[lang="en"] .pager .k,
:root[lang="fr"] .op .lab-hard,:root[lang="en"] .op .lab-hard,
:root[lang="fr"] .op .lab-easy,:root[lang="en"] .op .lab-easy{
  font-family:var(--mono);font-size:.65rem;letter-spacing:.16em;text-transform:uppercase}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--serif); font-size:17px; line-height:1.62;
  text-rendering:optimizeLegibility;
  -webkit-font-smoothing:antialiased;
  padding-left:max(18px,env(safe-area-inset-left,0px));
  padding-right:max(18px,env(safe-area-inset-right,0px));
  padding-block:0 4rem;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--paper)}
::selection{background:color-mix(in srgb,var(--rubric) 22%,transparent)}

/* ── binding rule ─────────────────────────────────────────── */
.spine{position:fixed;inset-block:0;inset-inline-start:0;width:max(10px,env(safe-area-inset-left,0px));z-index:1;pointer-events:none;
  background:linear-gradient(to left,color-mix(in srgb,var(--rubric) 10%,transparent),transparent)}
@media (max-width:780px){.spine{display:none}}

/* ── chrome ───────────────────────────────────────────────── */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:19;background:var(--paper);
  display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap;
  padding-block:.85rem .7rem;border-bottom:1px solid var(--rule);margin-bottom:2.2rem}
.brand{font-family:var(--naskh);font-weight:700;font-size:1.02rem;letter-spacing:.01em;
  margin:0;line-height:1.2;white-space:nowrap}
.brand b{color:var(--rubric);font-weight:700}
.bar nav{display:flex;gap:.1rem;margin-inline-start:auto;align-items:center}
.nlink{font-family:var(--naskh);font-size:.84rem;color:var(--ink-soft);text-decoration:none;
  padding:.3rem .62rem;border-radius:2px;border:1px solid transparent}
.nlink:hover{color:var(--ink);background:var(--leaf)}
.nlink[aria-current="page"]{color:var(--rubric);border-color:var(--rule)}
.tgl{background:none;border:1px solid var(--rule);color:var(--ink-soft);border-radius:2px;
  padding:.3rem .45rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.tgl:hover{color:var(--ink);border-color:var(--ink-faint)}
.langs{display:flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden;margin-inline:.4rem .15rem}
.langs button{appearance:none;background:none;border:0;border-inline-start:1px solid var(--rule);
  font-family:var(--mono);font-size:.67rem;letter-spacing:.06em;color:var(--ink-faint);
  padding:.32rem .45rem;cursor:pointer;line-height:1.25}
.langs button:first-child{border-inline-start:0}
.langs button:hover{color:var(--ink);background:var(--leaf)}
.langs button[aria-pressed="true"]{color:var(--rubric);background:var(--leaf)}

main{max-width:min(70rem,100%);margin:0 auto}
a{color:var(--indigo)}
:focus-visible{outline:2px solid var(--rubric);outline-offset:2px}

/* ── shared type ──────────────────────────────────────────── */
.eyebrow{font-family:var(--mono);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-faint);margin:0 0 .55rem}
.lat{font-family:var(--serif);font-feature-settings:"liga" 1}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3,h4{text-wrap:balance;margin:0}
.ar{font-family:var(--naskh)}
.ornament{display:block;text-align:center;color:var(--rubric);opacity:.6;margin:2.2rem 0;
  font-size:.9rem;letter-spacing:.9em}

/* ── frontispiece ─────────────────────────────────────────── */
.front{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1.5rem 2.5rem;align-items:end;
  padding-bottom:1.4rem;border-bottom:2px solid var(--rubric);margin-bottom:.5rem}
.front h1{font-family:var(--naskh);font-size:clamp(1.9rem,6vw,2.9rem);font-weight:700;line-height:1.15}
.front h1 span{color:var(--rubric)}
.sub{color:var(--ink-soft);font-family:var(--naskh);font-size:1rem;margin:.5rem 0 0;max-width:46ch}
.tally{text-align:center;min-width:8.5rem}
.tally .big{font-family:var(--mono);font-size:2.9rem;line-height:1;font-variant-numeric:tabular-nums;
  display:block;color:var(--ink)}
.tally .of{font-family:var(--mono);font-size:.76rem;color:var(--ink-faint);letter-spacing:.1em}
.tally .cap{font-family:var(--naskh);font-size:.8rem;color:var(--ink-soft);margin-top:.35rem}
@media (max-width:620px){.front{grid-template-columns:1fr}.tally{text-align:start;min-width:0}}

.meter{height:3px;background:var(--rule-soft);border-radius:99px;overflow:hidden;margin:.6rem 0 0}
.meter i{display:block;height:100%;background:var(--accent,var(--rubric));transition:width .45s ease}
@media (prefers-reduced-motion:reduce){.meter i{transition:none}}

.legend{display:flex;flex-wrap:wrap;gap:.35rem 1.4rem;margin:1.1rem 0 0;
  font-family:var(--naskh);font-size:.85rem;color:var(--ink-soft)}
.legend b{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);font-weight:500}
.dot{display:inline-block;width:.52em;height:.52em;border-radius:99px;margin-inline-end:.4em;
  vertical-align:.04em;background:currentColor}
.s0{color:var(--todo)}.s1{color:var(--doing)}.s2{color:var(--done)}

/* ── strip: search + exam ─────────────────────────────────── */
.strip{display:flex;gap:.8rem 1.6rem;flex-wrap:wrap;align-items:flex-end;margin:1.9rem 0 .4rem}
.field{flex:1 1 17rem;min-width:0}
.field label{display:block;font-family:var(--naskh);font-size:.82rem;
  color:var(--ink-faint);margin-bottom:.3rem}
input[type="search"],input[type="date"],input[type="text"]{
  width:100%;background:var(--leaf);border:1px solid var(--rule);border-radius:2px;
  color:var(--ink);font-family:var(--naskh);font-size:.95rem;padding:.5rem .7rem}
input[type="search"]::placeholder{color:var(--ink-faint)}
.countdown{font-family:var(--naskh);font-size:.88rem;color:var(--ink-soft);white-space:nowrap;padding-bottom:.55rem}
.countdown b{font-family:var(--mono);color:var(--rubric);font-variant-numeric:tabular-nums}

/* ── chapter cards ────────────────────────────────────────── */
.shelf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;
  background:var(--rule);border:1px solid var(--rule);margin:1.6rem 0 0}
@media (max-width:880px){.shelf{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:540px){.shelf{grid-template-columns:1fr}}
.chap{background:var(--leaf);padding:1.25rem 1.3rem 1.35rem;text-decoration:none;color:inherit;
  display:flex;flex-direction:column;gap:.1rem;min-width:0;position:relative;transition:background .18s}
.chap:hover{background:var(--leaf-2)}
.chap .rn{font-family:var(--mono);font-size:.72rem;letter-spacing:.18em;color:var(--accent);margin-bottom:.5rem}
.chap h3{font-family:var(--serif);font-size:1.12rem;font-weight:600;line-height:1.3}
.chap .arname{font-family:var(--naskh);font-size:.85rem;color:var(--ink-soft);margin-top:.15rem}
.chap .foot{display:flex;justify-content:space-between;align-items:baseline;gap:.8rem;
  margin-top:.95rem;font-family:var(--mono);font-size:.72rem;color:var(--ink-faint);
  font-variant-numeric:tabular-nums}
.chap .pct{color:var(--accent)}

/* ── saved / marked rows ──────────────────────────────────── */
.block{margin:3rem 0 0}
.block > h2{font-family:var(--naskh);font-size:1.12rem;font-weight:700;display:flex;align-items:baseline;gap:.6rem}
.block > h2::after{content:"";flex:1;height:1px;background:var(--rule)}
.hint{font-family:var(--naskh);font-size:.87rem;color:var(--ink-faint);margin:.5rem 0 0}

.rows{list-style:none;margin:.9rem 0 0;padding:0}
.rows li{border-bottom:1px solid var(--rule-soft)}
.row{display:grid;grid-template-columns:2.6rem 1fr auto;gap:.9rem;align-items:center;
  padding:.62rem .3rem;text-decoration:none;color:inherit;min-width:0}
.row:hover{background:var(--leaf)}
.row .n{font-family:var(--mono);font-size:.74rem;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.row .t{min-width:0}
.row .t .ttl{display:block;overflow-wrap:anywhere}
.row .t .sub2{font-family:var(--mono);font-size:.7rem;color:var(--ink-faint);display:block;margin-top:.12rem}
.row .marks{display:flex;align-items:center;gap:.5rem;font-size:.78rem;white-space:nowrap}
.pen{color:var(--indigo)}
.star{color:var(--rubric)}
.diffmark{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;padding:.1rem .35rem;
  border:1px solid currentColor;border-radius:2px}
.d1{color:var(--done)}.d2{color:var(--doing)}.d3{color:var(--rubric)}.d4{color:var(--rubric);background:color-mix(in srgb,var(--rubric) 14%,transparent)}

/* ── chapter page ─────────────────────────────────────────── */
.crumb{font-family:var(--naskh);font-size:.85rem;color:var(--ink-soft);margin:0 0 1.1rem;display:flex;gap:.5rem;align-items:center}
.crumb a{text-decoration:none;color:var(--ink-soft)}
.crumb a:hover{color:var(--rubric)}
.chead{border-bottom:2px solid var(--accent);padding-bottom:1.1rem;margin-bottom:1.6rem}
.chead h1{font-family:var(--serif);font-size:clamp(1.55rem,4.6vw,2.3rem);font-weight:600;line-height:1.2}
.chead .arname{font-family:var(--naskh);font-size:1rem;color:var(--ink-soft);margin-top:.3rem}
.chead .stats{display:flex;flex-wrap:wrap;gap:.3rem 1.3rem;margin-top:.9rem;
  font-family:var(--mono);font-size:.73rem;color:var(--ink-faint);font-variant-numeric:tabular-nums}

.part{margin:2.3rem 0 0}
.part > h2{font-family:var(--serif);font-size:1.05rem;font-weight:600;font-style:italic;color:var(--ink-soft);
  padding-bottom:.4rem;border-bottom:1px solid var(--rule)}
.prof{margin:1.5rem 0 0}
.prof > h3{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);font-weight:500;display:flex;align-items:baseline;gap:.55rem}
.prof > h3::after{content:"";flex:1;height:1px;background:var(--rule-soft)}

/* ── lesson page ──────────────────────────────────────────── */
.leaf{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,19rem);gap:2.2rem;align-items:start}
@media (max-width:900px){.leaf{grid-template-columns:1fr;gap:2rem}}
.lhead{padding-bottom:1rem;border-bottom:1px solid var(--rule);margin-bottom:1.3rem}
.lhead .pre{font-family:var(--mono);font-size:.7rem;letter-spacing:.16em;color:var(--accent);
  text-transform:uppercase;margin-bottom:.45rem}
.lhead h1{font-family:var(--serif);font-size:clamp(1.4rem,4.2vw,2.05rem);font-weight:600;line-height:1.22;
  overflow-wrap:anywhere}
.lhead .who{font-family:var(--naskh);font-size:.9rem;color:var(--ink-soft);margin-top:.45rem}

.controls{display:flex;flex-wrap:wrap;gap:1.1rem 1.8rem;margin:0 0 1.6rem}
.ctl{min-width:0}
.ctl > span{display:block;font-family:var(--naskh);font-size:.82rem;
  color:var(--ink-faint);margin-bottom:.38rem}
.seg{display:flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden;background:var(--leaf)}
.seg button{appearance:none;background:none;border:0;border-inline-start:1px solid var(--rule);
  font-family:var(--naskh);font-size:.85rem;color:var(--ink-soft);padding:.4rem .75rem;cursor:pointer;
  white-space:nowrap;transition:background .15s,color .15s}
.seg button:first-child{border-inline-start:0}
.seg button:hover{background:var(--leaf-2);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg.tone button[aria-pressed="true"]{background:var(--tone);color:#fff}
.seg button:disabled{opacity:.55;cursor:default}
.markbtn{font-family:var(--naskh);font-size:.85rem;background:var(--leaf);border:1px solid var(--rule);
  border-radius:2px;color:var(--ink-soft);padding:.4rem .8rem;cursor:pointer}
.markbtn[aria-pressed="true"]{color:var(--rubric);border-color:var(--rubric)}

/* notes: a ruled leaf with a rubric margin rule */
.notewrap{background:var(--leaf);border:1px solid var(--rule);box-shadow:var(--shadow);position:relative}
.notewrap::before{content:"";position:absolute;inset-block:0;inset-inline-start:2.3rem;width:1px;
  background:color-mix(in srgb,var(--rubric) 35%,transparent);pointer-events:none}
@media (max-width:520px){.notewrap::before{inset-inline-start:1.5rem}}
.notebar{display:flex;align-items:center;gap:.7rem;padding-block:.55rem;padding-inline:3.1rem .8rem;
  border-bottom:1px solid var(--rule-soft);flex-wrap:wrap}
.notebar h2{font-family:var(--naskh);font-size:.92rem;font-weight:700;margin-inline-end:auto}
.save{font-family:var(--naskh);font-size:.78rem;color:var(--ink-faint);min-width:5.2rem;text-align:start}
.save.on{color:var(--done)}
.notebody{padding-block:1.5rem 2rem;padding-inline:3.1rem 1.4rem}
@media (max-width:520px){.notebody{padding-inline:2.2rem .9rem}.notebar{padding-inline:2.2rem .7rem}}

textarea{width:100%;min-height:22rem;resize:vertical;background:transparent;border:0;
  color:var(--ink);font-family:var(--naskh);font-size:1.02rem;line-height:2.05rem;padding:0;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 2.04rem,var(--rule-soft) 2.04rem,var(--rule-soft) 2.05rem);
  background-attachment:local}
textarea:focus{outline:none}
textarea::placeholder{color:var(--ink-faint)}
.syntax{font-family:var(--mono);font-size:.67rem;color:var(--ink-faint);line-height:1.9;
  margin:1rem 0 0;padding-top:.7rem;border-top:1px dotted var(--rule)}
.syntax code{background:var(--leaf-2);padding:.05rem .3rem;border-radius:2px;color:var(--ink-soft)}

/* typeset note */
.typeset{font-family:var(--naskh);font-size:1.03rem;line-height:1.95;max-width:62ch}
.typeset > :first-child{margin-top:0}
.typeset p{margin:0 0 1.05em}
.typeset p.lede::before{content:"¶";color:var(--rubric);font-family:var(--serif);
  font-size:.95em;margin-inline-end:.35em;opacity:.8}
.typeset h3{font-family:var(--naskh);font-size:1.22rem;font-weight:700;margin:1.9em 0 .55em;
  padding-bottom:.25rem;border-bottom:1px solid var(--rule)}
.typeset h4{font-family:var(--naskh);font-size:1.02rem;color:var(--rubric);
  font-weight:700;margin:1.7em 0 .5em}
.typeset h5{font-family:var(--naskh);font-size:1.02rem;font-weight:700;color:var(--ink-soft);margin:1.4em 0 .4em}
.typeset ul,.typeset ol{margin:0 0 1.05em;padding-inline-start:1.6em;list-style:none}
.typeset ol{counter-reset:n}
.typeset li{margin-bottom:.35em;position:relative}
.typeset ul li::before{content:"◆";color:var(--rubric);font-size:.58em;opacity:.85;
  position:absolute;inset-inline-start:-1.7em;top:.72em}
.typeset ol li{counter-increment:n}
.typeset ol li::before{content:counter(n) ".";font-family:var(--mono);font-size:.74em;
  color:var(--rubric);position:absolute;inset-inline-start:-2.1em;top:.3em;
  font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.typeset blockquote{margin:1.3em 0;padding:.1em 1em;border-inline-start:2px solid var(--rubric);
  font-style:italic;color:var(--ink-soft)}
.typeset .flag{margin:1.3em 0;padding:.75em 1em;background:color-mix(in srgb,var(--rubric) 7%,transparent);
  border:1px solid color-mix(in srgb,var(--rubric) 28%,transparent);border-radius:2px}
.typeset .flaglab{display:block;font-family:var(--naskh);font-size:.8rem;
  font-weight:700;color:var(--rubric);margin-bottom:.15em}
.typeset mark{background:color-mix(in srgb,var(--doing) 26%,transparent);color:inherit;padding:0 .12em}
.typeset code{font-family:var(--mono);font-size:.86em;background:var(--leaf-2);padding:.08em .32em;border-radius:2px}
.typeset strong{font-weight:700}
.typeset hr{border:0;text-align:center;margin:1.4em 0}
.typeset hr::before{content:"❖";color:var(--rubric);opacity:.65;letter-spacing:.6em}
.empty{font-family:var(--naskh);color:var(--ink-faint);font-size:.95rem}

/* margin column cards */
.card{background:var(--leaf);border:1px solid var(--rule);padding:1rem 1.05rem 1.15rem;margin-bottom:1.1rem}
.card h2,.card h3{font-family:var(--naskh);font-size:.92rem;font-weight:700;margin-bottom:.1rem}
.cardhead{display:flex;align-items:baseline;gap:.7rem;justify-content:space-between}
.card .lab{font-family:var(--naskh);font-size:.82rem;color:var(--ink-faint);margin:.9rem 0 .3rem}
.card .lab:first-of-type{margin-top:.7rem}
.minibox{width:100%;min-height:4.6rem;background:transparent;border:1px dashed var(--rule);
  border-radius:2px;padding:.5rem .6rem;color:var(--ink);font-family:var(--naskh);font-size:.93rem;
  line-height:1.65;resize:vertical;background-image:none}
.minibox:focus{border-color:var(--ink-faint);border-style:solid}
.card .tip{font-family:var(--naskh);font-size:.78rem;color:var(--ink-faint);margin:.55rem 0 0}

.pager{display:flex;justify-content:space-between;gap:1rem;margin:2.6rem 0 0;
  padding-top:1.1rem;border-top:1px solid var(--rule)}
.pager a{flex:1 1 0;min-width:0;text-decoration:none;color:inherit;padding:.3rem 0}
.pager a:last-child{text-align:end}
.pager .k{display:block;font-family:var(--naskh);font-size:.8rem;color:var(--ink-faint)}
.pager a:hover .v{color:var(--rubric)}
.pager .v{font-size:.95rem;display:block;margin-top:.2rem;overflow-wrap:anywhere}

/* ── opinions page ────────────────────────────────────────── */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr));gap:1.1rem;margin-top:1.1rem}
.op{background:var(--leaf);border:1px solid var(--rule);border-top:2px solid var(--accent);padding:1.05rem 1.1rem 1.2rem}
.op h3{font-family:var(--serif);font-size:1.02rem;font-weight:600}
.op .arname{font-family:var(--naskh);font-size:.82rem;color:var(--ink-faint);margin-top:.1rem}
.op .txt{font-family:var(--naskh);font-size:.93rem;color:var(--ink-soft);margin:.7rem 0 0;white-space:pre-wrap}
.quote{font-family:var(--naskh);font-size:.93rem;white-space:pre-wrap;margin:.2rem 0 0;
  padding-inline-start:.7rem;border-inline-start:2px solid var(--rule)}
.op .lab-hard,.op .lab-easy{font-family:var(--naskh);font-size:.82rem;font-weight:700;margin:.95rem 0 .25rem}
.op .lab-hard{color:var(--rubric)}
.op .lab-easy{color:var(--done)}
.srclink{font-family:var(--mono);font-size:.68rem;color:var(--ink-faint);text-decoration:none}
.srclink:hover{color:var(--rubric)}
.offline{font-family:var(--naskh);font-size:.88rem;line-height:1.65;color:var(--doing);
  border:1px solid currentColor;border-radius:2px;padding:.6rem .85rem;margin:0 auto 1.6rem;
  max-width:min(70rem,100%);display:none}
.offline.show{display:block}
</style>

let LANG = "ar", T = I18N.ar, AB = "❯", AF = "❮";
try { const v = localStorage.getItem("s3-lang"); if (I18N[v]) LANG = v; } catch(e){}

function applyLang(){
  T = I18N[LANG];
  const rtl = T.dir === "rtl";
  AB = rtl ? "❯" : "❮";          /* back: toward the start of the line */
  AF = rtl ? "❮" : "❯";          /* forward: toward the end */
  document.documentElement.setAttribute("dir", T.dir);
  document.documentElement.setAttribute("lang", LANG);
  paintChrome();
}
function paintChrome(){
  document.getElementById("brand").innerHTML = esc(T.brand) + " <b>S3</b>";

/* ── model ───────────────────────────────────────────────── */
const ROMAN = ["I","II","III","IV","V","VI","VII","VIII","IX","X"];
/* labels live in I18N.<lang>.status / .diff, keyed by k */
const STATUS = [
  {k:0, tone:"var(--todo)"},
  {k:1, tone:"var(--doing)"},
  {k:2, tone:"var(--done)"}
];
const DIFF = [
  {k:1,cls:"d1",tag:"EASY",  tone:"var(--done)"},
  {k:2,cls:"d2",tag:"OK",    tone:"var(--doing)"},
  {k:3,cls:"d3",tag:"HARD",  tone:"var(--rubric)"},
  {k:4,cls:"d4",tag:"KILLER",tone:"var(--rubric)"}
];

const MODULES = RAW.map((m, mi) => {
  const mod = {
    id:"m" + (mi+1), mi, fr:m.fr, ar:m.ar, roman:ROMAN[mi],
    accent:"var(--c" + (mi+1) + ")", sections:[], lessons:[], profs:[]
  };
  let n = 0;
  m.sections.forEach((s, si) => {
    const sec = {label:s.label, groups:[]};
    s.groups.forEach(g => {
      const grp = {prof:g.prof, lessons:[]};
      if (mod.profs.indexOf(g.prof) < 0) mod.profs.push(g.prof);
      g.courses.forEach(title => {
        n++;
        const les = {
          id: mod.id + "-" + String(n).padStart(3,"0"),
          n, title, prof:g.prof, section:s.label,
          mi, mod
        };
        grp.lessons.push(les); mod.lessons.push(les);
      });
      sec.groups.push(grp);
    });
    mod.sections.push(sec);
  });
  return mod;
});
const ALL = MODULES.flatMap(m => m.lessons);
const BY_ID = Object.fromEntries(ALL.map(l => [l.id, l]));

/* ── state ───────────────────────────────────────────────── */
const S = {lessons:{}, modules:{}, prefs:{}, loaded:false};
let db = null, stale = false;

function les(id){ return S.lessons[id] || {}; }
function st(id){ const v = les(id).status; return v === 1 || v === 2 ? v : 0; }
function diff(id){ const v = les(id).diff; return v >= 1 && v <= 4 ? v : 0; }
function hasNote(id){ const d = les(id); return !!((d.note && d.note.trim()) || (d.hard && d.hard.trim()) || (d.easy && d.easy.trim())); }
function marked(id){ return !!les(id).mark; }
function modStats(m){
  let done = 0, doing = 0;
  m.lessons.forEach(l => { const v = st(l.id); if (v === 2) done++; else if (v === 1) doing++; });
  return {done, doing, left:m.lessons.length - done - doing, total:m.lessons.length,
          pct: m.lessons.length ? Math.round(done / m.lessons.length * 100) : 0};
}

/* ── helpers ─────────────────────────────────────────────── */
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fold = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const lat = s => '<span class="lat" dir="ltr">' + esc(s) + "</span>";

/* ── book-set notes ──────────────────────────────────────── */
function inlineFmt(s){
  return esc(s)
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/==([^=\n]+)==/g, "<mark>$1</mark>");
}
function typeset(src){
  const lines = String(src || "").replace(/\r/g,"").split("\n");
  const out = []; let para = [], list = null, firstPara = true;
  const flushPara = () => {
    if (!para.length) return;
    out.push('<p' + (firstPara ? ' class="lede"' : '') + ">" + inlineFmt(para.join("\n")).replace(/\n/g,"<br>") + "</p>");
    firstPara = false; para = [];
  };
  const flushList = () => { if (list){ out.push("</" + list + ">"); list = null; } };
  const openList = tag => { if (list !== tag){ flushList(); out.push("<" + tag + ">"); list = tag; } };
  for (const raw of lines){
    const line = raw.trimEnd();
    if (!line.trim()){ flushPara(); flushList(); continue; }
    let m;
    if (/^---+$/.test(line.trim())){ flushPara(); flushList(); out.push("<hr>"); continue; }
    if ((m = line.match(/^###\s+(.*)$/))){ flushPara(); flushList(); out.push("<h5>" + inlineFmt(m[1]) + "</h5>"); continue; }
    if ((m = line.match(/^##\s+(.*)$/))){ flushPara(); flushList(); out.push("<h4>" + inlineFmt(m[1]) + "</h4>"); continue; }
    if ((m = line.match(/^#\s+(.*)$/))){ flushPara(); flushList(); out.push("<h3>" + inlineFmt(m[1]) + "</h3>"); continue; }
    if ((m = line.match(/^!\s*(.*)$/))){ flushPara(); flushList();
      out.push('<div class="flag"><span class="flaglab">' + esc(T.important) + "</span>" + inlineFmt(m[1]) + "</div>"); continue; }
    if ((m = line.match(/^>\s?(.*)$/))){ flushPara(); flushList(); out.push("<blockquote>" + inlineFmt(m[1]) + "</blockquote>"); continue; }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))){ flushPara(); openList("ol"); out.push("<li>" + inlineFmt(m[1]) + "</li>"); continue; }
    if ((m = line.match(/^\s*[-*•]\s+(.*)$/))){ flushPara(); openList("ul"); out.push("<li>" + inlineFmt(m[1]) + "</li>"); continue; }
    flushList(); para.push(line);
  }
  flushPara(); flushList();
  return out.join("\n");
}

/* ── writes ──────────────────────────────────────────────── */
const local = {};            /* path -> last known body */
const queue = {};            /* path -> {dirty, running, timer} */
const DRAFT = "s3d:";        /* unsent writes, parked in this browser */
let saveTick = null;

function applyLocal(path, body){
  if (path.indexOf("lessons/") === 0) S.lessons[path.slice(8)] = body;
  else if (path.indexOf("modules/") === 0) S.modules[path.slice(8)] = body;
  else if (path === "meta/prefs") S.prefs = body;
}
function saveDraft(path){ try { localStorage.setItem(DRAFT + path, JSON.stringify(local[path])); } catch(e){} }
function clearDraft(path){ try { localStorage.removeItem(DRAFT + path); } catch(e){} }
function loadDrafts(){
  try {
    for (let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if (!k || k.indexOf(DRAFT) !== 0) continue;
      const body = JSON.parse(localStorage.getItem(k) || "null");
      if (!body || typeof body !== "object") continue;
      const path = k.slice(DRAFT.length);
      local[path] = body; applyLocal(path, body);
      (queue[path] || (queue[path] = {dirty:false, running:false, timer:0})).dirty = true;
    }
  } catch(e){}
}
function showSaving(on, done, msg){
  const el = document.getElementById("save");
  if (!el) return;
  const ok = !on && done && !msg;
  el.textContent = on ? T.saving : (msg || (done ? T.saved : ""));
  el.className = "save" + (ok ? " on" : "");
  if (ok){
    clearTimeout(saveTick);
    saveTick = setTimeout(() => { if (el.isConnected && el.textContent === T.saved) el.textContent = ""; }, 2600);
  }
}
function unchanged(path, body){
  const cur = local[path] || {};
  return Object.keys(body).every(k => cur[k] === body[k]);
}
/* Never block typing: a write that cannot reach the store is parked in this
   browser and pushed up the next time the store answers. */
function patch(path, body){
  if (unchanged(path, body)) return;
  local[path] = Object.assign({}, local[path], body);
  applyLocal(path, local[path]);
  const q = queue[path] || (queue[path] = {dirty:false, running:false, timer:0});
  q.dirty = true;
  clearTimeout(q.timer);
  showSaving(true);
  q.timer = setTimeout(() => { saveDraft(path); flush(path); }, 600);
}
async function flush(path){
  const q = queue[path];
  if (!q || q.running || !q.dirty) return;
  if (!db){ saveDraft(path); showSaving(false, false, T.savedLocal); return; }
  q.running = true;
  while (q.dirty){
    q.dirty = false;
    const body = Object.assign({}, local[path], {u: Date.now()});
    try { await db.doc(path).set(body); }
    catch (e){
      q.dirty = true; q.running = false; saveDraft(path);
      showSaving(false, false, T.saveFail);
      note(T.bFail(e && e.code ? " (" + e.code + ")" : ""));
      return;
    }
  }
  q.running = false; clearDraft(path);
  showSaving(false, true);
}
function flushAll(){ Object.keys(queue).forEach(p => { if (queue[p].dirty) flush(p); }); }
function note(msg){
  const el = document.getElementById("offline");
  if (!el) return; el.textContent = msg; el.classList.add("show");
}

const setLesson = (id, body) => patch("lessons/" + id, body);
const setModule = (id, body) => patch("modules/" + id, body);

  if (hasNote(id)) out.push('<span class="pen" title="' + esc(T.tNote) + '">✎</span>');

}

function renderAray(){
  const hard = ALL.filter(l => diff(l.id) >= 3).sort((a,b) => diff(b.id) - diff(a.id));
  const easy = ALL.filter(l => diff(l.id) === 1);
  const said = ALL.filter(l => (les(l.id).hard||"").trim() || (les(l.id).easy||"").trim());
  const ops = MODULES.filter(m => ((S.modules[m.id]||{}).opinion||"").trim());

  view.innerHTML =
    '<p class="crumb"><a href="#fihris">' + esc(T.navIndex) + "</a> " + AF + " <span>" + esc(T.navOps) + "</span></p>" +
    '<header class="chead" style="--accent:var(--rubric)"><p class="eyebrow">' + esc(T.opsEyebrow) + "</p>" +
      "<h1>" + esc(T.opsTitle) + "</h1>" +
      '<p class="arname">' + esc(T.opsSub) + "</p></header>" +

    '<section class="block"><h2>' + esc(T.opsHard) + "</h2>" +
      (hard.length ? '<ul class="rows">' + hard.map(l => lessonRow(l, true)).join("") + "</ul>"
        : '<p class="hint">' + esc(T.opsHardHint) + "</p>") + "</section>" +

    '<section class="block"><h2>' + esc(T.opsEasy) + "</h2>" +
      (easy.length ? '<ul class="rows">' + easy.map(l => lessonRow(l, true)).join("") + "</ul>"
        : '<p class="hint">' + esc(T.opsEasyHint) + "</p>") + "</section>" +

    '<section class="block"><h2>' + esc(T.opsSaid) + "</h2>" +
      (said.length ? '<div class="grid2">' + said.map(l =>
        '<article class="op" style="--accent:' + l.mod.accent + '"><h3>' + lat(l.title) + "</h3>" +
        '<p class="arname">' + esc(l.mod.fr) + " · " + esc(l.prof) + "</p>" +
        ((les(l.id).hard||"").trim() ? '<p class="lab-hard">' + esc(T.sHard) + '</p><p class="quote">' + esc(les(l.id).hard.trim()) + "</p>" : "") +
        ((les(l.id).easy||"").trim() ? '<p class="lab-easy">' + esc(T.sEasy) + '</p><p class="quote">' + esc(les(l.id).easy.trim()) + "</p>" : "") +
        '<p style="margin:.9rem 0 0"><a class="srclink" href="#l-' + l.id + '">' + esc(T.openPage) + " " + AF + "</a></p></article>").join("") + "</div>"
        : '<p class="hint">' + esc(T.opsSaidHint) + "</p>") + "</section>" +

    '<section class="block"><h2>' + esc(T.opsMods) + "</h2>" +
      (ops.length ? '<div class="grid2">' + ops.map(m =>
        '<article class="op" style="--accent:' + m.accent + '"><h3>' + lat(m.fr) + "</h3>" +
        '<p class="arname">' + esc(m.ar) + '</p><p class="txt">' + esc(S.modules[m.id].opinion.trim()) + "</p>" +
        '<p style="margin:.9rem 0 0"><a class="srclink" href="#' + m.id + '">' + esc(T.openMod) + " " + AF + "</a></p></article>").join("") + "</div>"
        : '<p class="hint">' + esc(T.opsModsHint) + "</p>") + "</section>" +
    '<span class="ornament">❖ ❖ ❖</span>';
}

/* ── router ──────────────────────────────────────────────── */
function render(){
  const h = (location.hash || "#fihris").slice(1);
  document.querySelectorAll(".nlink").forEach(a => {
    const on = a.dataset.v === h || (h.startsWith("m") && a.dataset.v === "fihris" && h !== "aray");
    if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  if (h.startsWith("l-") && BY_ID[h.slice(2)]) renderLesson(BY_ID[h.slice(2)]);
  else if (h === "aray") renderAray();
  else {
    const m = MODULES.find(x => x.id === h);
    if (m) renderModule(m); else renderIndex();
  }
  if (stale) document.getElementById("offline").classList.add("show");
}
/* never re-render under someone's fingers: wait until the field loses focus */
let pendingRender = false;
function safeRender(){
  const ae = document.activeElement;
  if (ae && (ae.tagName === "TEXTAREA" || ae.tagName === "INPUT")){ pendingRender = true; return; }
  pendingRender = false; render();
}
addEventListener("focusout", () => {
  if (!pendingRender) return;
  setTimeout(() => {
    const ae = document.activeElement;
    if (ae && (ae.tagName === "TEXTAREA" || ae.tagName === "INPUT")) return;
    pendingRender = false; render();
  }, 60);
});
let lastHash = location.hash;
addEventListener("hashchange", () => {
  const changed = lastHash !== location.hash; lastHash = location.hash;
  render(); if (changed) scrollTo({top:0, behavior:"instant"});
});

/* theme */
const root = document.documentElement;
try { const t = localStorage.getItem("s3-theme"); if (t) root.setAttribute("data-theme", t); } catch(e){}
document.getElementById("theme").addEventListener("click", () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const now = root.getAttribute("data-theme") || (dark ? "dark" : "light");
  const next = now === "dark" ? "light" : "dark";
  root.setAttribute("data-theme", next);
  try { localStorage.setItem("s3-theme", next); } catch(e){}
});

/* "/" focuses search on the index */
addEventListener("keydown", e => {
  if (e.key === "/" && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){
    const q = document.getElementById("q"); if (q){ e.preventDefault(); q.focus(); }
  }
});

applyLang();
loadDrafts();
render();

/* ── store ───────────────────────────────────────────────── */
async function useCap(name){
  try { return (await window.claude?.use?.(name)) || null; } catch(e){ return null; }
}
(async () => {
  db = await useCap("db");
  if (!db){
    S.loaded = true;
    note(T.bNoStore);
    safeRender(); return;
  }
  flushAll();   /* push anything written while the store was out of reach */

  const timer = setTimeout(() => {
    stale = true;
    note(T.bStale(""));
    safeRender();
  }, 10000);
  const settle = () => { clearTimeout(timer); stale = false; S.loaded = true;
    document.getElementById("offline").classList.remove("show"); safeRender(); };
  const busy = p => !!(queue[p] && (queue[p].dirty || queue[p].running));

  db.collection("lessons").onSnapshot(snap => {
    snap.docs.forEach(d => {
      const p = "lessons/" + d.id;
      if (busy(p)) return;
      S.lessons[d.id] = d.data() || {}; local[p] = S.lessons[d.id];
    });
    if (!snap.metadata.fromCache) settle(); else safeRender();
  }, e => {
    stale = true; S.loaded = true;
    note(T.bStale(e && e.code ? " (" + e.code + ")" : ""));
    safeRender();
  });

  db.collection("modules").onSnapshot(snap => {
    snap.docs.forEach(d => {
      const p = "modules/" + d.id;
      if (busy(p)) return;
      S.modules[d.id] = d.data() || {}; local[p] = S.modules[d.id];
    });
    safeRender();
  }, () => {});

  db.doc("meta/prefs").onSnapshot(snap => {
    const p = "meta/prefs";
    if (busy(p) || !snap.exists) return;
    S.prefs = snap.data() || {}; local[p] = S.prefs; safeRender();
  }, () => {});
})();
</script>
